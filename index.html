<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Arc & NoFap Tracker ❄️🔥</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>❄️ WINTER ARC & NOFAP TRACKER 🔥</h1>
        <div class="subtitle">Discipline × Retain Power × Fitness × Daily Execution — saved locally in your browser.</div>

        <!-- Top Overview Stats -->
        <div class="top">
            <div class="card nofap-card">
                <div class="number"><span id="nofapStreak">0</span> <span class="unit">days</span></div>
                <div class="label">🔥 NoFap Streak</div>
                <div class="nofap-status" id="nofapStatus">0 days completed</div>
            </div>
            <div class="card">
                <div class="number" id="daysDone">0</div>
                <div class="label">🏆 Perfect Days</div>
            </div>
            <div class="card">
                <div class="number" id="totalDone">0</div>
                <div class="label">⚡ Tasks Completed</div>
            </div>
            <div class="card">
                <div class="number" id="weekPercent">0%</div>
                <div class="label">📊 Current Week</div>
            </div>
            <div class="card">
                <div class="number" id="streak">0</div>
                <div class="label">🎯 Overall Habit Streak</div>
            </div>
        </div>

        <!-- Action Controls -->
        <div class="controls">
            <button onclick="goToday()">📅 Go to today</button>
            <button onclick="exportData()">💾 Export progress (JSON)</button>
            <button onclick="importDataPrompt()">📂 Import progress</button>
            <button class="danger" onclick="resetAll()">⚠️ Reset all data</button>
        </div>

        <input type="file" id="importInput" accept=".json" style="display:none" onchange="handleImport(event)">

        <!-- Tracker Grid -->
        <div id="tracker"></div>
    </div>

    <!-- Main Logic -->
    <script src="script.js"></script>
</body>
</html>
