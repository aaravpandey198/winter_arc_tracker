<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter Arc & NoFap Tracker ❄️🔥</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b1220;
        color: #e8f0ff;
    }
    .container { max-width: 1250px; margin: auto; padding: 24px; }
    h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: 0.5px; }
    .subtitle { color: #9db0c9; margin-bottom: 22px; }
    
    /* Top Stats Grid */
    .top {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
    }
    .card {
        background: #111c2e;
        border: 1px solid #263b59;
        border-radius: 14px;
        padding: 16px;
        position: relative;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
        transform: translateY(-2px);
    }
    
    /* Featured NoFap Streak Card */
    .card.nofap-card {
        background: linear-gradient(135deg, #221224 0%, #2f1422 100%);
        border: 1px solid #ff4b4b;
        box-shadow: 0 4px 18px rgba(255, 75, 75, 0.15);
    }
    .card.nofap-card .number {
        color: #ff5252;
        display: flex;
        align-items: baseline;
        gap: 6px;
    }
    .card.nofap-card .unit {
        font-size: 15px;
        color: #ff9d9d;
        font-weight: 500;
    }
    .card.nofap-card .label {
        color: #ffb8b8;
        font-weight: 600;
    }
    .nofap-status {
        font-size: 11px;
        margin-top: 6px;
        padding: 3px 8px;
        border-radius: 12px;
        display: inline-block;
        background: rgba(255, 82, 82, 0.15);
        color: #ff8585;
    }
    .nofap-status.active {
        background: rgba(74, 222, 128, 0.15);
        color: #4ade80;
    }

    .number { font-size: 28px; font-weight: bold; }
    .label { color: #9db0c9; font-size: 13px; margin-top: 4px; }
    
    .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
    button {
        background:#172943; color:#fff; border:1px solid #345477;
        padding:10px 15px; border-radius:9px; cursor:pointer;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background 0.15s;
    }
    button:hover { background:#203958; }
    button.danger:hover { background:#631a1a; border-color:#992929; }
    
    .week {
        background:#0f1929;
        border:1px solid #263b59;
        border-radius:16px;
        margin-bottom:18px;
        overflow:hidden;
    }
    .week-title {
        padding:14px 16px;
        background:#14243a;
        font-weight:bold;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }
    .day {
        border-top:1px solid #263b59;
        padding:15px;
        transition: background 0.15s;
    }
    .day.is-today {
        background: rgba(53, 183, 255, 0.05);
        border-left: 4px solid #35b7ff;
    }
    .day-head {
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        margin-bottom:12px;
    }
    .day-name { font-weight:bold; font-size:17px; display:flex; align-items:center; gap:8px; }
    .date-text { color:#8fa6c2; font-size:13px; }
    .badges-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge {
        padding:5px 9px; border-radius:20px; font-size:12px;
        background:#193653; color:#9ed8ff;
    }
    .badge-nofap-clean {
        background: #46142c;
        color: #ff85a8;
        border: 1px solid #8e2b5b;
        font-weight: bold;
    }
    .badge-today {
        background: #104169;
        color: #63d4ff;
        border: 1px solid #226b9c;
    }
    .tasks {
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:9px;
    }
    label.task {
        display:flex; align-items:center; gap:9px;
        padding:10px; background:#111f32; border-radius:9px;
        border:1px solid #20354f; cursor:pointer;
        user-select: none;
        transition: border-color 0.15s, background 0.15s;
    }
    label.task:hover { border-color:#4678a8; }
    
    /* Highlighted NoFap task item */
    label.task.nofap-task {
        background: linear-gradient(90deg, #251221 0%, #151c2d 100%);
        border: 1px solid #862d5b;
        font-weight: bold;
        color: #ffc4db;
    }
    label.task.nofap-task:hover {
        border-color: #ff4d79;
        box-shadow: 0 0 10px rgba(255, 77, 121, 0.2);
    }
    label.task.nofap-task input[type=checkbox] {
        accent-color: #ff3366;
    }

    input[type=checkbox] {
        width:18px; height:18px; accent-color:#35b7ff;
        cursor:pointer;
        flex-shrink: 0;
    }
    .done { text-decoration:line-through; opacity:.55; }
    .nofap-task.done { opacity: 0.85; text-decoration: none; border-color: #4ade80; color: #a7f3d0; background: #0e2920; }
    .nofap-task.done span::after { content: " ✔"; color: #4ade80; }

    .progress {
        height:7px; background:#1b2b42; border-radius:10px; overflow:hidden;
        margin-top:12px;
    }
    .bar { height:100%; background:#35b7ff; width:0%; transition:.2s; }
    @media(max-width:800px) {
        .top { grid-template-columns:repeat(2,1fr); }
    }
</style>
</head>
<body>
<div class="container">
    <h1>❄️ WINTER ARC & NOFAP TRACKER 🔥</h1>
    <div class="subtitle">Discipline × Retain Power × Fitness × Daily Execution — saved locally in your browser.</div>

    <div class="top">
        <div class="card nofap-card">
            <div class="number"><span id="nofapStreak">0</span> <span class="unit">days</span></div>
            <div class="label">🔥 NoFap Streak</div>
            <div class="nofap-status" id="nofapStatus">Checking status...</div>
        </div>
        <div class="card">
            <div class="number" id="daysDone">0</div>
            <div class="label">🏆 Perfect Days</div>
        </div>
        <div class="card">
            <div class="number" id="totalDone">0</div>
            <div class="label">⚡ Tasks Completed</div>
        </div>
        <div class="card">
            <div class="number" id="weekPercent">0%</div>
            <div class="label">📊 Current Week</div>
        </div>
        <div class="card">
            <div class="number" id="streak">0</div>
            <div class="label">🎯 Overall Habit Streak</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="goToday()">📅 Go to today</button>
        <button onclick="exportData()">💾 Export progress (JSON)</button>
        <button onclick="importDataPrompt()">📂 Import progress</button>
        <button class="danger" onclick="resetAll()">⚠️ Reset all data</button>
    </div>

    <input type="file" id="importInput" accept=".json" style="display:none" onchange="handleImport(event)">

    <div id="tracker"></div>
</div>

<script>
const KEY = "winterArcTracker_v1";
const START_KEY = "winterArcTracker_start_v1";

// Persistent Start Date (anchors the 12-week challenge)
function getStartDate() {
    const saved = localStorage.getItem(START_KEY);
    if (saved) {
        const d = new Date(saved);
        if (!isNaN(d.getTime())) {
            d.setHours(0,0,0,0);
            return d;
        }
    }
    const today = new Date();
    today.setHours(0,0,0,0);
    localStorage.setItem(START_KEY, today.toISOString());
    return today;
}

const START = getStartDate();

// Daily routines with NoFap checklist item included on every single day
const routines = {
    0: ["No Fap (Clean Day) 🔥", "Weekly academic revision", "LeetCode / DSA", "AI / Backend project", "Muay Thai (optional/light)", "Weekly review & planning", "Sleep 7–8h"],
    1: ["No Fap (Clean Day) 🔥", "College", "Study / college revision", "Internship skill / project", "LeetCode", "Gym", "Muay Thai", "Sleep 7–8h"],
    2: ["No Fap (Clean Day) 🔥", "College", "Study / college revision", "LeetCode", "Gym", "Sleep 7–8h"],
    3: ["No Fap (Clean Day) 🔥", "College", "Study / college revision", "Internship skill / project", "LeetCode", "Gym", "Sleep 7–8h"],
    4: ["No Fap (Clean Day) 🔥", "College", "Study / college revision", "Internship skill / project", "LeetCode", "Muay Thai", "Sleep 7–8h"],
    5: ["No Fap (Clean Day) 🔥", "College", "Study / college revision", "LeetCode", "Gym", "Muay Thai (light)", "AI / Backend project", "Sleep 7–8h"],
    6: ["No Fap (Clean Day) 🔥", "College", "Study / college revision", "LeetCode", "Gym", "Sleep 7–8h"]
};

const names = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function isNoFapTask(taskName) {
    return /no\s*fap/i.test(taskName);
}

function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch(e) { return {}; }
}
let data = load();

function keyFor(d) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

function pretty(d) {
    return d.toLocaleDateString(undefined, {weekday:"long", day:"2-digit", month:"short", year:"numeric"});
}

function save() {
    localStorage.setItem(KEY, JSON.stringify(data));
    updateStats();
}

function toggle(dayKey, i, el) {
    if (!data[dayKey]) data[dayKey] = {};
    data[dayKey][i] = el.checked;
    
    if (el.closest('.task').classList.contains('nofap-task')) {
        el.closest('.task').classList.toggle("done", el.checked);
    } else {
        el.parentElement.classList.toggle("done", el.checked);
    }
    
    save();
    updateDayProgress(dayKey);
}

function updateDayProgress(dayKey) {
    const box = document.querySelector(`[data-day="${dayKey}"]`);
    if (!box) return;
    const checks = box.querySelectorAll("input[type=checkbox]");
    const done = [...checks].filter(x=>x.checked).length;
    const pct = checks.length ? Math.round(done/checks.length*100) : 0;
    box.querySelector(".bar").style.width = pct+"%";
    box.querySelector(".pct").textContent = pct+"%";

    // Update NoFap badge on day header
    const nfBadge = box.querySelector(".badge-nofap-clean");
    const d = new Date(dayKey + "T00:00:00");
    const tasks = routines[d.getDay()] || [];
    const nfIdx = tasks.findIndex(isNoFapTask);
    const isClean = nfIdx !== -1 && data[dayKey] && !!data[dayKey][nfIdx];
    if (nfBadge) {
        nfBadge.style.display = isClean ? "inline-block" : "none";
    }
}

// Check if a given date has NoFap completed
function isDayNoFapDone(d) {
    const dKey = keyFor(d);
    const tasks = routines[d.getDay()] || [];
    const nfIdx = tasks.findIndex(isNoFapTask);
    if (nfIdx === -1) return false;
    return !!(data[dKey] && data[dKey][nfIdx]);
}

// Calculate NoFap streak: resets on the day when NoFap was not checked
function calculateNoFapStreak() {
    const today = new Date();
    today.setHours(0,0,0,0);
    
    const todayDone = isDayNoFapDone(today);
    
    // Check yesterday's status
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    const yesterdayDone = isDayNoFapDone(yesterday);

    let streak = 0;
    let checkDate = new Date(today);

    if (todayDone) {
        // Today is completed -> streak starts at 1, check backward
        streak = 1;
        checkDate.setDate(today.getDate() - 1);
    } else {
        // Today not checked yet.
        // If yesterday was NOT checked, streak has reset to 0!
        if (!yesterdayDone) {
            return { streak: 0, todayDone: false, yesterdayDone: false };
        }
        // If yesterday was checked, user's streak from yesterday is still alive pending today's check-in
        streak = 1;
        checkDate.setDate(today.getDate() - 2);
    }

    // Traverse consecutive previous days backwards
    // If any day was not checked, the streak breaks at that point!
    while (true) {
        if (checkDate < START) {
            // Reached before tracker start date
            break;
        }
        if (isDayNoFapDone(checkDate)) {
            streak++;
            checkDate.setDate(checkDate.getDate() - 1);
        } else {
            // Break! Streak resets here
            break;
        }
    }

    return { streak, todayDone, yesterdayDone };
}

function render() {
    const root = document.getElementById("tracker");
    root.innerHTML = "";
    const todayStr = keyFor(new Date());

    for (let w=0; w<12; w++) {
        const week = document.createElement("div");
        week.className = "week";
        const ws = new Date(START);
        ws.setDate(START.getDate() + w*7);
        week.innerHTML = `<div class="week-title">
            <span>WEEK ${w+1}</span>
            <span>${ws.toLocaleDateString(undefined,{day:"2-digit",month:"short"})} →</span>
        </div>`;
        
        for (let j=0; j<7; j++) {
            const d = new Date(ws);
            d.setDate(ws.getDate()+j);
            const dayKey = keyFor(d);
            const dow = d.getDay();
            const tasks = routines[dow];
            const saved = data[dayKey] || {};
            const isToday = dayKey === todayStr;

            const day = document.createElement("div");
            day.className = "day" + (isToday ? " is-today" : "");
            day.dataset.day = dayKey;
            day.id = "day-"+dayKey;

            const taskHTML = tasks.map((t,i)=>{
                const checked = !!saved[i];
                const isNF = isNoFapTask(t);
                const taskClass = `task ${isNF ? 'nofap-task' : ''} ${checked ? 'done' : ''}`;
                return `<label class="${taskClass}">
                    <input type="checkbox" ${checked?'checked':''} onchange="toggle('${dayKey}',${i},this)">
                    <span>${t}</span>
                </label>`;
            }).join("");

            day.innerHTML = `
                <div class="day-head">
                    <div>
                        <div class="day-name">
                            ${names[dow]}
                        </div>
                        <div class="date-text">${pretty(d)}</div>
                    </div>
                    <div class="badges-group">
                        <span class="badge badge-nofap-clean" style="display:none;">🔥 CLEAN</span>
                        ${isToday ? '<span class="badge badge-today">TODAY</span>' : ''}
                        <span class="badge">${dow===0?'REST / RESET':(dow===1||dow===3||dow===5||dow===6?'GYM DAY':'MUAY THAI DAY')}</span>
                    </div>
                </div>
                <div class="tasks">${taskHTML}</div>
                <div class="progress"><div class="bar"></div></div>
                <div class="date-text" style="margin-top:6px"><span class="pct">0%</span> complete</div>
            `;
            week.appendChild(day);
        }
        root.appendChild(week);
    }
    for (const k of Object.keys(data)) updateDayProgress(k);
    updateStats();
}

function updateStats() {
    let total=0, done=0, perfect=0;
    const today = new Date(); today.setHours(0,0,0,0);

    for (let w=0; w<12; w++) {
        const ws = new Date(START); ws.setDate(START.getDate()+w*7);
        for(let j=0;j<7;j++){
            const d=new Date(ws); d.setDate(ws.getDate()+j);
            const arr=routines[d.getDay()];
            const s=data[keyFor(d)]||{};
            const n=arr.filter((_,i)=>s[i]).length;
            total += arr.length; done += n;
            if(n===arr.length) perfect++;
        }
    }
    
    // Update NoFap Streak
    const nfInfo = calculateNoFapStreak();
    document.getElementById("nofapStreak").textContent = nfInfo.streak;
    const nfStatusEl = document.getElementById("nofapStatus");
    if (nfInfo.todayDone) {
        nfStatusEl.textContent = "⚡ Clean today! Streak extended.";
        nfStatusEl.className = "nofap-status active";
    } else if (nfInfo.streak > 0) {
        nfStatusEl.textContent = "⏳ Pending check-in for today";
        nfStatusEl.className = "nofap-status";
    } else {
        nfStatusEl.textContent = "⚠️ Streak reset — Stay strong & check in!";
        nfStatusEl.className = "nofap-status";
    }

    document.getElementById("daysDone").textContent=perfect;
    document.getElementById("totalDone").textContent=done;
    
    // Week stats
    const weekStart = new Date(today);
    weekStart.setDate(today.getDate()-today.getDay());
    let wd=0, wt=0;
    for(let j=0;j<7;j++){
        const d=new Date(weekStart); d.setDate(weekStart.getDate()+j);
        const arr=routines[d.getDay()], s=data[keyFor(d)]||{};
        wt+=arr.length; wd+=arr.filter((_,i)=>s[i]).length;
    }
    document.getElementById("weekPercent").textContent=wt ? Math.round(wd/wt*100)+"%" : "0%";
    
    // Overall all-tasks Streak
    let streak=0;
    for(let offset=0;offset<84;offset++){
        const d=new Date(today); d.setDate(today.getDate()-offset);
        const arr=routines[d.getDay()], s=data[keyFor(d)]||{};
        if(arr.length && arr.every((_,i)=>s[i])) streak++;
        else if(offset===0) continue;
        else break;
    }
    document.getElementById("streak").textContent=streak;
}

function goToday(){
    const el=document.getElementById("day-"+keyFor(new Date()));
    if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
}

function resetAll(){
    if(confirm("Reset ALL tracker data and streaks? This cannot be undone.")){
        data={}; 
        localStorage.removeItem(KEY);
        localStorage.removeItem(START_KEY);
        location.reload();
    }
}

function exportData(){
    const exportObj = {
        startDate: START.toISOString(),
        data: data,
        version: "v2"
    };
    const blob=new Blob([JSON.stringify(exportObj,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="winter-arc-nofap-progress.json";
    a.click();
    URL.revokeObjectURL(a.href);
}

function importDataPrompt(){
    document.getElementById('importInput').click();
}

function handleImport(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(evt){
        try {
            const imported = JSON.parse(evt.target.result);
            if (imported.data) {
                data = imported.data;
                if (imported.startDate) {
                    localStorage.setItem(START_KEY, imported.startDate);
                }
            } else {
                data = imported;
            }
            save();
            render();
            alert("Progress imported successfully!");
        } catch(err) {
            alert("Invalid JSON file.");
        }
    };
    reader.readAsText(file);
}

render();
</script>
</body>
</html>
